name: ZackMute
options:
  bundleIdPrefix: de.benkrammer
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"

targets:
  ZackMute:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - ZackMute
    resources:
      - ZackMute/Assets.xcassets
    info:
      path: ZackMute/Info.plist
      properties:
        CFBundleName: ZackMute
        CFBundleDisplayName: ZackMute
        CFBundleIdentifier: de.benkrammer.ZackMute
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSHighResolutionCapable: true
        LSMinimumSystemVersion: "15.0"
    entitlements:
      path: ZackMute/ZackMute.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.benkrammer.ZackMute
        PRODUCT_NAME: ZackMute
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: KeyboardShortcuts
